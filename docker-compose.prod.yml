## Déploiement internet (VM Oracle Cloud Always Free, ou toute VM Linux avec
## Docker et un nom de domaine). Voir DEPLOIEMENT.md pour le pas-à-pas complet.
##
## Différences avec docker-compose.yml (dev/test local) :
##  - aucun port de base/backend publié sur l'hôte : seul Caddy est exposé,
##    db et backend ne sont joignables que par les autres conteneurs ;
##  - Caddy termine le TLS (certificat Let's Encrypt automatique) et sert de
##    reverse proxy vers le frontend, dont nginx.conf relaie déjà /api vers
##    le backend en interne ;
##  - redémarrage automatique des conteneurs (restart: unless-stopped) ;
##  - images construites et publiées par GitHub Actions à chaque tag (voir
##    .github/workflows/deploiement.yml et outils/deployer.sh) ; VERSION
##    choisit le tag, « latest » par défaut. `up -d --build` reconstruit
##    encore sur place si besoin ;
##  - aucun secret par défaut : DB_PASSWORD, JWT_SECRET, DOMAINE et les
##    identifiants SMTP doivent être définis dans un fichier .env (voir
##    .env.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plongee
      POSTGRES_USER: plongee
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plongee -d plongee"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/dimkahn/suivi-plongee-backend:${VERSION:-latest}
    build:
      context: ./backend
      # « execution-ia » : image avec Claude Code, git, Maven et Node pour
      # l'assistant IA (voir DEPLOIEMENT.md, « Assistant IA en production »).
      target: ${BACKEND_CIBLE:-execution}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/plongee
      DB_USER: plongee
      DB_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD dans .env}
      JWT_SECRET: ${JWT_SECRET:?definir JWT_SECRET dans .env (openssl rand -base64 48)}
      CORS_ORIGINES: https://${DOMAINE:?definir DOMAINE dans .env}
      FRONTEND_URL: https://${DOMAINE:?definir DOMAINE dans .env}
      SMTP_HOTE: ${SMTP_HOTE:?definir SMTP_HOTE dans .env (par exemple smtp.gmail.com)}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_UTILISATEUR: ${SMTP_UTILISATEUR:?definir SMTP_UTILISATEUR dans .env}
      SMTP_MOT_DE_PASSE: ${SMTP_MOT_DE_PASSE:?definir SMTP_MOT_DE_PASSE dans .env (mot de passe d'application pour Gmail)}
      MAIL_EXPEDITEUR: ${MAIL_EXPEDITEUR:-Club de plongee <no-reply@cppjvo.fr>}
      CLUB_NOM: ${CLUB_NOM:-Club de plongee}
      # Assistant IA : coupé tant que IA_ACTIVE n'est pas à true (et l'image
      # construite avec BACKEND_CIBLE=execution-ia). Accès par code envoyé à
      # app.ia.email-code (application.yml), avec les SMTP_* ci-dessus.
      IA_ACTIVE: ${IA_ACTIVE:-false}
      IA_DEPOT: /ia/depot
      IA_DOSSIER: /ia/travail
      IA_DEPOT_DISTANT: git@github.com:dimkahn/suivi-plongee.git
      # Jeton de l'abonnement Claude (claude setup-token).
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_CONFIG_DIR: /ia/claude
      # Clé de déploiement GitHub (droit d'écriture), pour le clone et le push
      # du tag par le serveur ; jamais transmise à Claude Code lui-même.
      GIT_SSH_COMMAND: ssh -i /ia/ssh/cle-deploiement -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/ia/known_hosts
      GIT_AUTHOR_NAME: Assistant IA
      GIT_AUTHOR_EMAIL: ${IA_EMAIL_COMMITS:-assistant-ia@invalid}
      GIT_COMMITTER_NAME: Assistant IA
      GIT_COMMITTER_EMAIL: ${IA_EMAIL_COMMITS:-assistant-ia@invalid}
    volumes:
      # Dépôt de l'assistant, copies de travail, journal, historique Claude.
      - ia-donnees:/ia
      - ia-maven:/root/.m2
      # Clé de déploiement, déposée à la main sur le serveur (jamais commitée).
      - ./ia-ssh:/ia/ssh:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/dimkahn/suivi-plongee-frontend:${VERSION:-latest}
    build:
      context: ./frontend
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAINE: ${DOMAINE:?definir DOMAINE dans .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  db-data:
  ia-donnees:
  ia-maven:
  caddy-data:
  caddy-config:
