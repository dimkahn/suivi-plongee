spring:
  application:
    name: suivi-plongee
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Europe/Paris
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Photos du trombinoscope : 5 Mo max, revalide côté serveur dans EleveController.
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    # A REMPLACER en production : openssl rand -base64 48
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLWVuLXByb2R1Y3Rpb24tY2xlLWRlLTQ4LW9jdGV0cy1taW5pbXVt}
    duree-acces-minutes: 30
    # « Se souvenir de moi » coché : cookie persistant, renouvelé à chaque usage.
    duree-refresh-jours: 90
    # Case décochée : cookie de session (effacé à la fermeture du navigateur),
    # borné aussi côté serveur, certains navigateurs restaurant ces cookies.
    duree-session-heures: 12
  cors:
    origines: ${CORS_ORIGINES:http://localhost:4200}
  # Sert a construire les liens envoyes par courriel (reinitialisation de
  # mot de passe, invitation d'un moniteur).
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    # Adresse affichee comme expediteur ; distincte de spring.mail.username,
    # qui est le compte SMTP utilise pour l'authentification.
    expediteur: ${MAIL_EXPEDITEUR:Club de plongee <no-reply@cppjvo.fr>}
  club:
    # Nom de la structure, en-tete obligatoire de la fiche de securite (A322-72).
    nom: ${CLUB_NOM:Club de plongee}

# Seul /actuator/health est exposé (autorisé sans jeton dans SecurityConfig),
# pour le contrôle de santé du déploiement. Le serveur SMTP n'y est pas
# vérifié : une messagerie momentanément injoignable ne doit pas faire
# échouer une mise en production.
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /api-docs

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:plongee;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  flyway:
    locations: classpath:db/migration, classpath:db/demo

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plongee}
    username: ${DB_USER:plongee}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOTE}
    port: ${SMTP_PORT:587}
    username: ${SMTP_UTILISATEUR}
    password: ${SMTP_MOT_DE_PASSE}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
