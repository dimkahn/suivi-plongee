spring:
  application:
    name: suivi-plongee
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Europe/Paris
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Photos du trombinoscope : 5 Mo max, revalide côté serveur dans EleveController.
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    # A REMPLACER en production : openssl rand -base64 48
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLWVuLXByb2R1Y3Rpb24tY2xlLWRlLTQ4LW9jdGV0cy1taW5pbXVt}
    duree-acces-minutes: 30
    duree-refresh-jours: 14
  cors:
    origines: ${CORS_ORIGINES:http://localhost:4200}
  # Sert a construire les liens envoyes par courriel (reinitialisation de
  # mot de passe, invitation d'un moniteur).
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /api-docs

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:plongee;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  flyway:
    locations: classpath:db/migration, classpath:db/demo

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plongee}
    username: ${DB_USER:plongee}
    password: ${DB_PASSWORD}
