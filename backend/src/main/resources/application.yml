spring:
  application:
    name: suivi-plongee
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Europe/Paris
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 20 Mo pour les pièces jointes de l'assistant IA (10 par message). Les
      # photos gardent 5 Mo, vérifiés par leurs services (EleveController,
      # PhotoMoniteurService, PhotoPretService).
      max-file-size: 20MB
      max-request-size: 60MB

app:
  jwt:
    # A REMPLACER en production : openssl rand -base64 48
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLWVuLXByb2R1Y3Rpb24tY2xlLWRlLTQ4LW9jdGV0cy1taW5pbXVt}
    duree-acces-minutes: 30
    # « Se souvenir de moi » coché : cookie persistant, renouvelé à chaque usage.
    duree-refresh-jours: 90
    # Case décochée : cookie de session (effacé à la fermeture du navigateur),
    # borné aussi côté serveur, certains navigateurs restaurant ces cookies.
    duree-session-heures: 12
  cors:
    origines: ${CORS_ORIGINES:http://localhost:4200}
  # Sert a construire les liens envoyes par courriel (reinitialisation de
  # mot de passe, invitation d'un moniteur).
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    # Adresse affichee comme expediteur ; distincte de spring.mail.username,
    # qui est le compte SMTP utilise pour l'authentification.
    expediteur: ${MAIL_EXPEDITEUR:Club de plongee <no-reply@cppjvo.fr>}
  club:
    # Nom de la structure, en-tete obligatoire de la fiche de securite (A322-72).
    nom: ${CLUB_NOM:Club de plongee}
  # Assistant IA (fr.club.plongee.ia, page /ia) : Claude Code piloté depuis
  # l'application. Coupé par défaut ; activé en profil dev, ou en production
  # par IA_ACTIVE=true (image backend « execution-ia », voir DEPLOIEMENT.md).
  # L'accès exige en plus un code envoyé par courriel (AccesIaService).
  ia:
    active: ${IA_ACTIVE:false}
    # Depot git principal : mvn spring-boot:run se lance depuis backend/.
    depot: ${IA_DEPOT:/home/dev/suivi-plongee-ia}
    # Adresse GitHub du dépôt, pour que le serveur le clone dans « depot » au
    # premier usage (production). Vide : le dépôt doit déjà y être.
    depot-distant: ${IA_DEPOT_DISTANT:}
    # Copies de travail (une par session) et journal.log, hors du depot.
    dossier-travail: ${IA_DOSSIER:${user.home}/.suivi-plongee-ia}
    claude: ${IA_CLAUDE:claude}
    mvn: ${IA_MVN:mvn}
    # Code d'accès à usage unique (OTP), envoyé à cette adresse et à elle
    # seule, quel que soit l'admin qui le demande.
    email-code: ${IA_EMAIL_CODE:kahn.dimitri@gmail.com}
    # Validité du code à partir de son envoi : il se saisit dans ce délai,
    # et l'accès qu'il ouvre se referme à la fin du même délai. En mémoire :
    # un redémarrage du serveur referme aussi l'accès.
    validite-code-minutes: 60
    # Serveur d'envoi du code, à part de spring.mail (le profil dev n'envoie
    # aucun autre courriel). Mêmes variables qu'en production ; sans
    # SMTP_HOTE, pas de code.
    smtp:
      hote: ${SMTP_HOTE:}
      port: ${SMTP_PORT:587}
      utilisateur: ${SMTP_UTILISATEUR:}
      mot-de-passe: ${SMTP_MOT_DE_PASSE:}

# Seul /actuator/health est exposé (autorisé sans jeton dans SecurityConfig),
# pour le contrôle de santé du déploiement. Le serveur SMTP n'y est pas
# vérifié : une messagerie momentanément injoignable ne doit pas faire
# échouer une mise en production.
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /api-docs

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:plongee;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  flyway:
    locations: classpath:db/migration, classpath:db/demo

# Assistant IA : activé par ce profil (IA_ACTIVE=false pour le couper).
app:
  ia:
    active: ${IA_ACTIVE:true}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plongee}
    username: ${DB_USER:plongee}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOTE}
    port: ${SMTP_PORT:587}
    username: ${SMTP_UTILISATEUR}
    password: ${SMTP_MOT_DE_PASSE}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
