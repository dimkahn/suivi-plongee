server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API relayée vers le backend Spring Boot (nom du service docker-compose)
    location /api {
        # Aligné sur spring.servlet.multipart.max-file-size (5 Mo, photo élève) :
        # la limite par défaut de nginx (1 Mo) coupait l'upload avant le backend.
        client_max_body_size 5M;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers qui disent quelle version charger : toujours revalidés auprès du
    # serveur, sinon le navigateur peut garder l'ancienne version des jours
    # (il fallait alors vider le cache pour voir une mise en production).
    location ~ ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # Scripts et styles compilés : leur nom contient une empreinte du contenu,
    # une nouvelle version porte donc un nouveau nom. Cache long sans risque.
    # (ex. main-7GXQ2K4Z.js, chunk-B_hHwKX7.js, styles-…css).
    location ~ "^/(main|polyfills|styles|chunk)-[^/]+\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Application Angular en mode SPA : toute route inconnue retombe sur
    # index.html, jamais mis en cache (voir plus haut).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
