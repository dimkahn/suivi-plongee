# Tests et images à chaque tag vX... posé sur un commit de master :
#   git tag v2026.09.1 && git push origin v2026.09.1
#
# 1. vérifie que le commit tagué est bien sur master ;
# 2. lance les tests d'intégration du backend ;
# 3. construit les images backend et frontend (x86 et ARM) et les publie sur
#    ghcr.io.
#
# La mise en production n'est plus faite ici : sur le serveur,
# outils/surveiller-tags.sh voit le nouveau tag, construit ses propres images
# et déploie (voir DEPLOIEMENT.md, « Déploiement automatique »). Les images
# de ghcr.io restent utilisables à la main avec outils/deployer.sh.
# Le bouton « Run workflow » relance les tests et les images d'un tag existant.

name: Tests et images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag à revérifier, par exemple v2026.09.1
        required: true

# Jamais deux publications d'images en même temps ; une en cours n'est pas interrompue.
concurrency:
  group: images
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verification:
    name: Tag sur master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Le commit tagué appartient à master
        run: |
          # Le tag sert de tag d'image : on n'accepte que des caractères sûrs.
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Tag « $TAG » refusé : attendu v suivi de chiffres, lettres, points ou tirets."
            exit 1
          fi
          git fetch origin master
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/master; then
            echo "::error::Le tag $TAG ne pointe pas sur un commit de master : pas d'images publiées."
            exit 1
          fi

  tests:
    name: Tests backend
    needs: verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: mvn test
        working-directory: backend
        run: mvn -B test

  images:
    name: Image ${{ matrix.service }}
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dimkahn/suivi-plongee-${{ matrix.service }}:${{ env.TAG }}
            ghcr.io/dimkahn/suivi-plongee-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/dimkahn/suivi-plongee
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
